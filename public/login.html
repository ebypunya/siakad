<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SIAKAD Kampus</title>
  <!-- CDN Tailwind CSS untuk styling instan -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
    <!-- Header Card -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-800">SIAKAD</h1>
      <p class="text-sm text-slate-500 mt-1">Sistem Informasi Akademik</p>
    </div>

    <!-- Alert Pesan Error / Sukses -->
    <div id="alert-msg" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

    <!-- Form Login -->
    <form id="form-login" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">NIM / NIP / Username</label>
        <input 
        type="text" 
        id="username" 
        name="username"
        required 
        placeholder="Masukkan ID Anda" 
        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
        <input 
        type="password" 
        id="password" 
        name="password"
        required 
        placeholder="••••••••" 
        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm"
        >
      </div>

      <button 
      type="submit" 
      id="btn-submit"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition duration-200 text-sm"
      >
      Masuk Akun
    </button>
  </form>

  <!-- Footer Card -->
  <p class="text-xs text-center text-slate-400 mt-8">
    &copy; 2026 SIAKAD Engine • Node.js & MariaDB
  </p>
</div>

<!-- JavaScript untuk menghubungkan Form ke Backend API Express -->
<script>
  const formLogin = document.getElementById('form-login');
  const alertMsg = document.getElementById('alert-msg');
  const btnSubmit = document.getElementById('btn-submit');

  formLogin.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

      // Ubah tombol jadi status loading
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Memproses...';
      alertMsg.classList.add('hidden');

      try {
        // Kirim request POST ke Endpoint API Express
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (response.ok) {
          showAlert('Login berhasil! Mengalihkan...', 'bg-green-100 text-green-700 border border-green-300');
          
          // Simpan token JWT dan data user di localStorage browser
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));

          // Arahkan ke halaman dashboard
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);

        } else {
          showAlert(result.message || 'Username atau password salah.', 'bg-red-100 text-red-700 border border-red-300');
        }
      } catch (err) {
        showAlert('Gagal terhubung ke server backend.', 'bg-red-100 text-red-700 border border-red-300');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Masuk Akun';
      }
    });

  function showAlert(message, classes) {
    alertMsg.className = `mb-4 p-3 rounded-lg text-sm text-center ${classes}`;
    alertMsg.innerText = message;
    alertMsg.classList.remove('hidden');
  }
</script>
</body>
</html>
