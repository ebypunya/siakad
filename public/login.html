<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — SIAKAD UkCorelabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb two"></div>

  <div class="brand-row">
    <div class="brand-mark">SC</div>
    <div class="brand-text">SIAKAD <span>UkCorelabs</span></div>
  </div>

  <div class="border-glow">
    <div class="form-card">
      <div class="form-head">
        <div class="status"><span class="dot"></span> Portal akademik aktif</div>
        <h2>Selamat datang kembali</h2>
        <p>Masuk untuk mengakses SIAKAD UkCorelabs.</p>
      </div>

      <div class="alert" id="loginAlert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        <span id="loginAlertText">NIM/Username atau kata sandi salah.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="field-label" for="username">NIM / Username</label>
          <div class="input-wrap">
            <input type="text" id="username" placeholder="Masukkan NIM atau username" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="password">Kata Sandi</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" aria-label="Tampilkan kata sandi">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="remember"><input type="checkbox" id="remember"> Ingat saya</label>
          <a href="forgot-password" class="link-accent">Lupa kata sandi?</a>
        </div>

        <button type="submit" class="btn-primary" id="btnLogin">
          <span id="btnLabel">Masuk</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <div class="divider">belum punya akun</div>
      <p class="helper-text">Baru pertama kali di sini? <a href="register">Daftar akun</a></p>
    </div>
  </div>

  <footer class="site-foot">Dev<span>#477</span> &copy; copyright</footer>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
