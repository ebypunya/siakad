<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — SIAKAD UkCorelabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb two"></div>

  <div class="brand-row">
    <div class="brand-mark">SC</div>
    <div class="brand-text">SIAKAD <span>UkCorelabs</span></div>
  </div>

  <div class="border-glow">
    <div class="form-card">
      <div class="form-head">
        <div class="status"><span class="dot"></span> Pendaftaran dibuka</div>
        <h2>Buat akun baru</h2>
        <p>Isi data di bawah untuk mendaftar ke SIAKAD UkCorelabs.</p>
      </div>

      <div class="alert" id="registerAlert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        <span id="registerAlertText">Terjadi kesalahan, periksa kembali data kamu.</span>
      </div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label class="field-label" for="fullname">Nama Lengkap</label>
          <div class="input-wrap">
            <input type="text" id="fullname" placeholder="Sesuai KTP/KTM" autocomplete="name" required>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="nim">NIM</label>
          <div class="input-wrap">
            <input type="text" id="nim" placeholder="Nomor Induk Mahasiswa" inputmode="numeric" autocomplete="off" required>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="email">Email</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="nama@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="password">Kata Sandi</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Minimal 8 karakter" autocomplete="new-password" required>
            <button type="button" class="toggle-pass" aria-label="Tampilkan kata sandi">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-meter" id="strengthMeter"><span></span><span></span><span></span></div>
          <div class="strength-label" id="strengthLabel">Kekuatan kata sandi</div>
        </div>

        <div class="field">
          <label class="field-label" for="confirmPassword">Konfirmasi Kata Sandi</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" placeholder="Ulangi kata sandi" autocomplete="new-password" required>
            <button type="button" class="toggle-pass" aria-label="Tampilkan kata sandi">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-error" id="confirmError">Kata sandi tidak sama.</div>
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" required>
          <span>Saya menyetujui <a href="#" class="link-accent">Syarat &amp; Ketentuan</a> serta <a href="#" class="link-accent">Kebijakan Privasi</a> SIAKAD UkCorelabs.</span>
        </label>

        <button type="submit" class="btn-primary" id="btnRegister">
          <span id="btnLabel">Daftar</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <div class="divider">sudah punya akun</div>
      <p class="helper-text">Sudah terdaftar? <a href="/">Masuk di sini</a></p>
    </div>
  </div>

  <footer class="site-foot">Dev<span>#477</span> &copy; copyright</footer>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/register.js"></script>
</body>
</html>
